version: "2.3"

services:
  postgres:
    container_name: service-postgres
    image: postgres:12
    environment: &db_env
      POSTGRES_DB: chat_db_1
      POSTGRES_USER: chat-user
      POSTGRES_PASSWORD: password
    ports:
      - 5432
    volumes:
      - ./postgresql/schemas:/docker-entrypoint-initdb.d
      - ./.pgdata:/var/lib/postgresql/data
    networks:
      - postgres

  chat-container:
    image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg:latest
    privileged: true
    environment:
      <<: *db_env
      PREFIX: ${PREFIX:-~/.local}
      CCACHE_DIR: /chat/.ccache
      CORES_DIR: /cores
    volumes:
      - .:/chat:rw
      - ${TC_CORES_DIR:-./.cores}:/cores:rw
    ports:
      - 8080:8080
      - 8181:8181
    working_dir: /chat
    entrypoint:
      - ./tests/run_as_user.sh
    depends_on:
      - postgres
    networks:
      - postgres

networks:
  postgres:
    driver: bridge